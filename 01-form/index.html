<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
</head>
<body>
    <h1>Create An Account</h1>
    <form>
        <div>
            <label for="firstname">First name</label>
            <input type="text" id="firstname" name="firstname" required placeholder="First name"/>
        </div>
        <div>
           <label for="lastname">Last name</label>
            <input type="text" id="lastname" name="lastname" required placeholder="Last name"/> 
        </div>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Email"/>
        <label for="username">User name</label>
        <input type="text" id="username" name="username" required placeholder="User name"/>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Password"/>
        <label for="birthdate">Birth date</label>
        <input type="date" id="birthdate" name="birthdate" required/>
        <label for="range">How happy are you?</label>
        <input type="range" id="range" name="range" min="0" max="10" step="1" list="tickmarks"/>
        <datalist id="tickmarks">
            <option value="0"></option>
            <option value="1"></option>
            <option value="2"></option>
            <option value="3"></option>
            <option value="4"></option>
            <option value="5"></option>
            <option value="6"></option>
            <option value="7"></option>
            <option value="8"></option>
            <option value="9"></option>
            <option value="10"></option>
            

        </datalist>
        <label for="color">What is your fav. color</label>
        <input type="color" id="color" name="color" required/>
        <button type="submit">Create Account</button>

    </form>
</body>
</html>
