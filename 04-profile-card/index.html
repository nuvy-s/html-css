<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>My profile</h1>
    <div class="container">
        <header>
            <div class="profile"><i class="fa-solid fa-face-smile"></i></div>
                <div class="text">
                    <h2>내이름은?</h2>
                    <p>오늘의 기분은?</p>
                </div>
        </header>
        <main>
            <div class="icon"><i class="fa-solid fa-user"></i></div>
            <div class="icon"><i class="fa-solid fa-comment"></i></div>
            <div class="icon"><i class="fa-solid fa-gear"></i></div>
        </main>
        <footer>
            <div class="set">
                <div class="photo"><i class="fa-solid fa-sun"></i></div>
                <div class="texts">
                    <h3>기쁘다</h3>
                    <p>오늘도 맑음</p>
                </div>
            </div>
                  <div class="set">
                <div class="photo"><i class="fa-solid fa-skull"></i></div>
                <div class="texts">
                    <h3>화나다</h3>
                    <p>폭염경보!!!!</p>
                </div>
            </div>
                  <div class="set">
                <div class="photo"><i class="fa-solid fa-bolt"></i></div>
                <div class="texts">
                    <h3>슬프다</h3>
                    <p>폭우경보!!!</p>
                </div>
            </div>
        </footer>
    </div>
   
    <script src="https://kit.fontawesome.com/ac1501784d.js"></script>
</body>
</html>
